# --- Modern Theme (Tokyo Night Style) ---
# You can also use 'include current-theme.conf' if you have a theme file
background #1a1b26
foreground #c0caf5
selection_background #283457
cursor #c0caf5
url_color #7aa2f7
hide_window_decorations yes   

# ANSI Colors
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6
color8 #414868
color9 #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# --- Window Styling ---
font_family JetBrainsMono Nerd Font
font_size 12.0
window_padding_width 10
window_border_width 2pt
active_border_color #7aa2f7
inactive_border_color #292e42

# --- Background Image ---
# Replace the path below with your actual image path
background_image /home/mukundan/dotfiles/.config/wezterm/wallpaper/bg-blurred-lighter.png
background_image_layout cscaled
background_image_layout_options fill

# --- Optional: Transparency ---
# Uncomment if you want the image to be slightly transparent
# background_opacity 0.85   
