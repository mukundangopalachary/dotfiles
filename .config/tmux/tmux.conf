# ==================================================
# TRUECOLOR
# ==================================================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ==================================================
# GENERAL
# ==================================================

set -g mouse on
set -g history-limit 100000
set -g escape-time 0

setw -g mode-keys vi
set -g status-keys vi

# ==================================================
# WINDOW / PANE INDEXING
# ==================================================

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ==================================================
# SPLITS OPEN IN CURRENT DIRECTORY
# ==================================================

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

# ==================================================
# COPY MODE
# ==================================================

bind Enter copy-mode

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# ==================================================
# STATUS BAR
# ==================================================

set -g status on
set -g status-position bottom
set -g status-interval 1

set -g status-style "bg=#07141a,fg=#d6deeb"

set -g status-left-length 100
set -g status-right-length 100

# ==================================================
# LEFT SIDE
# ==================================================

set -g status-left \
"#[fg=#07141a,bg=#82aaff,bold] SESSION #[fg=#82aaff,bg=#102028,nobold] #S "

# ==================================================
# WINDOWS
# ==================================================

setw -g window-status-separator ""

# inactive
setw -g window-status-format \
"#[fg=#5c6773,bg=#07141a] #I:#W "

# active
setw -g window-status-current-format \
"#[fg=#07141a,bg=#5fd7ff,bold] #I:#W "

# activity
setw -g window-status-activity-style \
"fg=#ffd787,bg=#07141a"

# bell
setw -g window-status-bell-style \
"fg=#ff5f87,bg=#07141a,bold"

# ==================================================
# RIGHT SIDE
# ==================================================

set -g status-right \
"#[fg=#82aaff,bold]  %H:%M #[fg=#3b4a55]│ #[fg=#89ddff]  %a #[fg=#5fd7ff]%d %b "

# ==================================================
# PANE BORDERS
# ==================================================

set -g pane-border-style \
"fg=#1a2a33"

set -g pane-active-border-style \
"fg=#82aaff"

# ==================================================
# MESSAGE STYLE
# ==================================================

set -g message-style \
"fg=#07141a,bg=#82aaff"

# ==================================================
# COPY MODE STYLE
# ==================================================

set -g mode-style \
"fg=#07141a,bg=#ffd787"

# ==================================================
# TPM PLUGINS
# ==================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# ==================================================
# TMUX YANK
# ==================================================

set -g @yank_selection_mouse 'clipboard'
set -g @yank_with_mouse on

# ==================================================
# TMUX RESURRECT
# ==================================================

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save 'C-s'
set -g @resurrect-restore 'C-r'

# ==================================================
# RELOAD CONFIG
# ==================================================

bind r source-file ~/.config/tmux/tmux.conf \; \
display-message "tmux config reloaded"

# ==================================================
# TPM INIT
# ==================================================

run '~/.config/tmux/plugins/tpm/tpm'
